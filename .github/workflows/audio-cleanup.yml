# 목적: Storage에 1시간 넘게 남은 녹음 파일을 매시간 지운다(결정 2026-10-21-녹음업로드 4번, 2026-10-27-녹음임시보관 5번).
# 예약 실행(schedule)은 GitHub 기본 브랜치의 workflow만 돈다. 기본 브랜치를 main-codyssey로 바꾸면서
# 공모전 사이트 정리를 이 파일이 이어 맡는다(결정 2026-11-04-기본브랜치전환).
# - contest: 공모전 사이트. 매시간 17분 + 수동. 저장소 Secrets의 CRON_SECRET(공모전 사이트와 같은 값).
# - codyssey: 코디세이 사이트. 매시간 실행은 Supabase Cron이 맡고, 여기는 수동 진단용. CODYSSEY_CRON_SECRET.
# 비밀 값이 없으면 그 작업만 건너뛴다.
name: 녹음 파일 정리

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  contest:
    runs-on: ubuntu-latest
    steps:
      - name: 공모전 사이트에서 1시간 넘은 녹음 지우기
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET이 없어 건너뜁니다."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" \
            https://care-bridge-kappa.vercel.app/api/cron/audio-cleanup

  codyssey:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 코디세이 사이트에서 1시간 넘은 녹음 지우기 (수동 진단)
        env:
          CRON_SECRET: ${{ secrets.CODYSSEY_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CODYSSEY_CRON_SECRET이 없어 건너뜁니다."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" \
            https://carebridge-codyssey.vercel.app/api/cron/audio-cleanup
