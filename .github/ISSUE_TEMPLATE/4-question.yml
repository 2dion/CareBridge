name: 질문·결정 요청
description: 다른 담당이나 팀장의 답·결정이 있어야 진행할 수 있어요.
title: "[질문] "
labels: ["질문"]
body:
  - type: markdown
    attributes:
      value: |
        실명은 쓰지 않습니다. 답할 사람의 담당 라벨(팀장 결정이면 `팀장`)과 기한 라벨을 붙여 주세요.
        답이 결정이면, 답을 결정 기록이나 문서에 옮기는 PR이 이 이슈를 닫습니다.
  - type: textarea
    id: question
    attributes:
      label: 질문
      description: 한 줄로
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 지금 정해진 것
      description: 관련 문서·결정 기록·코드
  - type: textarea
    id: options
    attributes:
      label: 고를 수 있는 안
      description: 안마다 좋은 점과 걸리는 점, 추천이 있으면 표시
      placeholder: |
        - A안(추천): ...
        - B안: ...
  - type: input
    id: blocks
    attributes:
      label: 답이 없으면 막히는 일
      placeholder: "예: R4 가명 수정 화면(FE)"
