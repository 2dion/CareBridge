<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <title>M20 글자 크기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="screens.css" />
  </head>
  <body>
    <main class="screen has-tabs" data-screen="M20_font_size_settings">
      <div class="status-bar">
        <span>9:41</span
        ><svg width="68" height="12" viewBox="0 0 68 12" aria-hidden="true">
          <g fill="currentColor">
            <rect x="0" y="8" width="3" height="4" rx="1" />
            <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
            <rect x="10" y="3" width="3" height="9" rx="1" />
            <rect x="15" y="0" width="3" height="12" rx="1" />
            <path
              d="M30 2.2a10 10 0 0 1 7.2 3l-1.4 1.4a8 8 0 0 0-11.6 0l-1.4-1.4A10 10 0 0 1 30 2.2zm0 4a6 6 0 0 1 4.3 1.8L30 12.3 25.7 8A6 6 0 0 1 30 6.2z"
            />
            <rect
              x="42"
              y="1"
              width="23"
              height="10"
              rx="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              opacity="0.5"
            />
            <rect x="44" y="3" width="19" height="6" rx="1.5" />
            <rect x="66" y="4" width="2" height="4" rx="1" opacity="0.5" />
          </g>
        </svg>
      </div>
      <header class="app-bar">
        <div class="side">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </div>
        <div class="title"><strong>글자 크기</strong><span class="vi">Kích thước chữ</span></div>
        <div class="side side-right"></div>
      </header>
      <div class="center" style="margin-top: 20px">
        <b style="font-size: 17px">읽기 편한 글자 크기를 선택해 주세요.</b>
        <p class="vi" style="font-size: 13px; margin-top: 4px">Chọn cỡ chữ dễ đọc nhất cho bạn.</p>
      </div>
      <section class="preview card">
        <span style="align-self: flex-start"><span class="badge badge-green">미리보기</span></span>
        <h3>돌봄 기록</h3>
        <div class="sample">
          <b style="font-size: 16px">식사</b>
          <p style="font-size: 17px; margin-top: 6px">아침 식사를 잘하셨어요.</p>
          <span class="vi" style="font-size: 13px; margin-top: -4px">Bữa sáng diễn ra tốt.</span>
        </div>
        <div class="note-line">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v5M12 8h.01" /></svg
          ><span>선택한 크기가 실제 화면에 적용돼요.</span>
        </div>
      </section>
      <div style="margin: 26px 22px 12px">
        <b style="font-size: 17px">글자 크기 선택</b>
        <p style="font-size: 13px; color: var(--color-muted); margin-top: 4px">
          앱 전체에 동일하게 적용됩니다.
        </p>
      </div>
      <div class="size-grid">
        <div class="size-card"><b style="font-size: 15px">Aa</b>작게</div>
        <div class="size-card on"><b style="font-size: 19px">Aa</b>보통</div>
        <div class="size-card"><b style="font-size: 24px">Aa</b>크게</div>
      </div>
      <div class="pad" style="margin-top: 16px">
        <div class="btn btn-primary btn-center"><span class="label">적용</span></div>
      </div>
      <nav class="tab-bar">
        <div class="tab">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg
          ><span>오늘</span>
        </div>
        <div class="tab">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <path d="M8 8h8M8 12h8M8 16h5" /></svg
          ><span>기록함</span>
        </div>
        <div class="tab">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
            <path d="M19 2v4M17 4h4" /></svg
          ><span>도우미</span>
        </div>
        <div class="tab active">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" /></svg
          ><span>내 정보</span>
        </div>
      </nav>
    </main>
  </body>
</html>
