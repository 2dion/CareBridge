<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390" />
    <title>M01 사용 안내</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="screens.css" />
  </head>
  <body>
    <main class="screen" data-screen="M01_onboarding">
      <div class="status-bar">
        <span>9:41</span
        ><svg width="68" height="12" viewBox="0 0 68 12" aria-hidden="true">
          <g fill="currentColor">
            <rect x="0" y="8" width="3" height="4" rx="1" />
            <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
            <rect x="10" y="3" width="3" height="9" rx="1" />
            <rect x="15" y="0" width="3" height="12" rx="1" />
            <path
              d="M30 2.2a10 10 0 0 1 7.2 3l-1.4 1.4a8 8 0 0 0-11.6 0l-1.4-1.4A10 10 0 0 1 30 2.2zm0 4a6 6 0 0 1 4.3 1.8L30 12.3 25.7 8A6 6 0 0 1 30 6.2z"
            />
            <rect
              x="42"
              y="1"
              width="23"
              height="10"
              rx="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              opacity="0.5"
            />
            <rect x="44" y="3" width="19" height="6" rx="1.5" />
            <rect x="66" y="4" width="2" height="4" rx="1" opacity="0.5" />
          </g>
        </svg>
      </div>
      <header class="app-bar">
        <div class="side">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </div>
        <div class="title"><strong>사용 안내</strong><span class="vi">Hướng dẫn</span></div>
        <div class="side"></div>
      </header>
      <div class="progress"><span class="on"></span><span></span><span></span></div>
      <section class="hero">
        <h1>안녕하세요,<br /><em>새싹로봇</em>이에요.</h1>
        <p class="hero-vi vi">Xin chào, tôi là robot Mầm non.</p>
        <p class="desc">케어브릿지에서 말로 돌봄 기록을<br />시작해 볼게요.</p>
        <p class="desc-vi vi">Cùng CareBridge ghi chép bằng giọng nói.</p>
      </section>
      <img class="robot-welcome" src="robot-welcome.png" alt="새싹로봇" />
      <section class="features">
        <div class="feature">
          <div class="bubble">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
            </svg>
          </div>
          <strong>말로 기록</strong><span class="f-vi vi">Ghi bằng giọng nói</span>
          <p>복잡한 입력 없이<br />바로 시작해요.</p>
          <span class="p-vi vi">Bắt đầu dễ dàng.</span>
        </div>
        <div class="feature">
          <div class="bubble">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="3" />
              <path d="M8 9h8M8 13h8M8 17h5" />
            </svg>
          </div>
          <strong>쉽게 확인</strong><span class="f-vi vi">Dễ kiểm tra</span>
          <p>AI가 내용을 정리해<br />초안을 보여줘요.</p>
          <span class="p-vi vi">AI soạn bản nháp.</span>
        </div>
      </section>
      <div class="cta">
        <div class="btn btn-primary">
          <span class="spacer"></span><span>다음 · Tiếp</span
          ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </div>
      </div>
      <p class="skip">건너뛰기 · Bỏ qua</p>
    </main>
  </body>
</html>
